version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @solana/* 8.x major bumps deferred until x402/@solana compatibility
      # confirmed (2026-08-31); PRs #9/#10 closed.
      - dependency-name: "@solana/kit"
      - dependency-name: "@solana/transactions"
